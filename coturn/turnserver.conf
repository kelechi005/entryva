# coturn config for officer-to-officer call relay.
# See coturn/README.md for the full setup (DNS, firewall ports, TLS).
#
# Auth: "TURN REST API" scheme — static-auth-secret is a shared secret
# with the backend (must equal TURN_SECRET in backend/.env). The backend
# mints short-lived username/password pairs per call
# (RealtimeService.buildIceServers) rather than the frontend ever holding
# a permanent TURN credential — a credential baked into the frontend
# bundle would be extractable by anyone and never expire.
use-auth-secret
static-auth-secret=c07360541335253afa0f54e8d4333707bd002eed0756a435764e4c054f6dad3e

# The realm just needs to match between server config and generated
# credentials — RealtimeService uses this same value.
realm=estate-visitor-platform

# Standard TURN port. 5349 (turns:, TLS) is commented out below since it
# needs a real certificate — see README for enabling it.
listening-port=3478
# tls-listening-port=5349
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/privkey.pem

# Relay port range: TURN needs a pool of UDP ports to actually relay
# media through, not just the one signaling port above — this is why
# coturn runs with network_mode: host in docker-compose.yml rather than
# Docker's usual per-port mapping (mapping 20,000 individual ports isn't
# practical). Open this exact range on the host firewall too.
min-port=49152
max-port=49452

# REPLACE with this server's actual public IP before deploying — coturn
# needs to know its own external address to hand out working relay
# candidates. Without this, calls behind certain NATs will silently fail
# to relay even though the server itself is reachable.
# external-ip=YOUR.SERVER.PUBLIC.IP

# Don't relay to the coturn box's own private network / other internal
# services — standard hardening so this can't be abused as an open proxy
# into your infrastructure.
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# This server is for call relay only, not a general-purpose STUN/TURN
# service — no need for coturn's CLI/admin interface.
no-cli
no-tlsv1
no-tlsv1_1

fingerprint
lt-cred-mech
