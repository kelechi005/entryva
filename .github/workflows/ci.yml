name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/entryva-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/entryva-frontend

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npx prisma generate
      - working-directory: backend
        run: npm run lint
      - working-directory: backend
        run: npm test

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test

  build-and-push:
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.PRODUCTION_API_BASE_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Skipped entirely until the DEPLOY_HOST repo variable is set (see
  # DEPLOYMENT.md step 5) — pushing to main before then still lints,
  # tests, and publishes images, it just doesn't try to touch a server.
  deploy:
    needs: build-and-push
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile,db-backup/backup.sh"
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 0

      - name: Migrate + deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH }}
            export BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            export FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            export GIT_SHA=${{ github.sha }}
            docker compose -f docker-compose.prod.yml run --rm backend npx prisma migrate deploy
            docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 120

  smoke-test:
    needs: deploy
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the deployed commit is live
        run: |
          set -e
          url="${{ vars.PRODUCTION_API_BASE_URL }}/health"
          response="$(curl -fsS "$url")"
          echo "Response: $response"
          echo "$response" | grep -q "${{ github.sha }}" || {
            echo "Deployed version does not match commit ${{ github.sha }}";
            exit 1;
          }
          